<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドパガキングダム RPG EX</title>
    <!-- Favicon 404エラー防止用のインラインデータURI -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 bg-slate-950">

    <div id="app" class="w-full max-w-4xl min-h-[720px] flex flex-col justify-between pixel-box-dark relative overflow-hidden p-3 sm:p-5">
        
        <!-- HEADER / TOP STATUS BAR -->
        <header class="w-full pixel-box p-3 mb-3 flex flex-wrap items-center justify-between gap-2 bg-slate-900">
            <div class="flex items-center gap-3">
                <span class="text-xl sm:text-2xl text-amber-400 font-bold tracking-wider font-pixel cursor-pointer" onclick="renderHomeScreen()">👑 ドパガキングダム</span>
                <span class="text-xs bg-slate-800 text-amber-300 px-2 py-0.5 rounded border border-amber-600 font-bold">Ver 2.4 EX</span>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                <button onclick="openProfileScreen()" class="pixel-box-gold px-2.5 py-1 flex items-center gap-2 cursor-pointer hover:opacity-90 transition-opacity">
                    <canvas id="header-profile-icon" width="36" height="36" class="pixel-box bg-slate-950 rounded"></canvas>
                    <span id="header-profile-name" class="text-amber-300 text-xs font-bold truncate max-w-[90px]">名無しファイター</span>
                </button>
                <div class="pixel-box-gold px-3 py-1 flex items-center gap-2">
                    <span class="text-amber-300 text-xs font-bold">DOPA:</span>
                    <span id="dopa-count" class="text-amber-400 font-bold text-lg font-pixel">1000</span>
                </div>
                <button id="btn-sound-toggle" onclick="audioSystem.toggleSound()" class="pixel-btn text-xs px-2 py-1">
                    🔊: <span id="sound-status">ON</span>
                </button>
                <button id="btn-bgm-toggle" onclick="audioSystem.toggleBGM()" class="pixel-btn text-xs px-2 py-1">
                    🎵: <span id="bgm-status">OFF</span>
                </button>
            </div>
        </header>

        <!-- DYNAMIC CONTENT CONTAINER -->
        <main id="screen-container" class="flex-1 flex flex-col justify-center items-center w-full relative">
            <!-- Screen content injected via JS -->
        </main>

        <!-- FOOTER / SYSTEM MESSAGES -->
        <footer class="w-full mt-3 text-center text-xs text-slate-500 border-t border-slate-800 pt-2 flex justify-between items-center px-2">
            <span>© 2026 DOPAGA KINGDOM RPG EX</span>
            <span class="text-slate-400 text-[11px]">8-Bit Retro Battle Engine Powered</span>
        </footer>
    </div>

    <!-- MODAL / NOTIFICATION OVERLAY -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/85 hidden flex items-center justify-center p-4 z-50">
        <div class="pixel-box bg-slate-900 max-w-md w-full p-5 text-center relative border-amber-400">
            <h3 id="modal-title" class="text-xl font-bold text-amber-400 mb-3 font-pixel"></h3>
            <div id="modal-body" class="text-slate-200 mb-6 text-sm leading-relaxed whitespace-pre-line max-h-80 overflow-y-auto text-left"></div>
            <div id="modal-actions" class="flex justify-center gap-3">
                <button onclick="closeModal()" class="pixel-btn pixel-btn-primary px-6 py-2 font-bold text-sm">閉じる</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
