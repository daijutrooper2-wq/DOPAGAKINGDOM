<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   

    <title>ドパキン</title>

    <!-- iPhoneなどのホーム画面に追加したときのアプリ名 -->
    <meta name="apple-mobile-web-app-title" content="ドパキン">

    <!-- アイコンの設定 (imagesフォルダ内の DOPAGAKINGDOM.png を指定) -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/DOPAGAKINGDOM.png">
    <link rel="apple-touch-icon" href="images/DOPAGAKINGDOM.png">
    <!-- Favicon 404エラー防止用のインラインデータURI -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="w-screen h-screen overflow-hidden flex flex-col items-center justify-center p-0 m-0 bg-slate-950">

    <div id="app" class="w-full h-full flex flex-col justify-between pixel-box-dark relative overflow-hidden p-2 sm:p-4">
        
        <!-- DYNAMIC CONTENT CONTAINER -->
        <main id="screen-container" class="flex-1 flex flex-col justify-center items-center w-full relative overflow-hidden">
            <!-- Screen content injected via JS -->
        </main>

        <!-- FOOTER / SYSTEM MESSAGES -->
        <footer class="w-full text-center text-[10px] text-slate-500 border-t border-slate-800 pt-1 flex justify-between items-center px-2 shrink-0">
            <span>© 2026 DOPAGA KINGDOM RPG EX</span>
            <span class="text-slate-400 text-[10px]">Landscape Mode Active</span>
        </footer>
    </div>

    <!-- MODAL / NOTIFICATION OVERLAY -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/85 hidden flex items-center justify-center p-2 sm:p-4 z-50">
        <div class="pixel-box bg-slate-900 max-w-md w-full p-3 sm:p-5 text-center relative border-amber-400 max-h-[90vh] flex flex-col">
            <h3 id="modal-title" class="text-base sm:text-xl font-bold text-amber-400 mb-2 sm:mb-3 font-pixel"></h3>
            <div id="modal-body" class="text-slate-200 mb-4 sm:mb-6 text-xs sm:text-sm leading-relaxed whitespace-pre-line max-h-[60vh] overflow-y-auto text-left flex-1 pr-1"></div>
            <div id="modal-actions" class="flex justify-center gap-3">
                <button onclick="closeModal()" class="pixel-btn pixel-btn-primary px-6 py-2 font-bold text-sm">閉じる</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
