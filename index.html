<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   

    <title>ドパキン</title>

    <!-- iPhoneなどのホーム画面に追加したときのアプリ名 -->
    <meta name="apple-mobile-web-app-title" content="ドパキン">

    <!-- アイコンの設定 (imagesフォルダ内の DOPAGAKINGDOM.png を指定) -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/DOPAGAKINGDOM.png">
    <link rel="apple-touch-icon" href="images/DOPAGAKINGDOM.png">
    <!-- Favicon 404エラー防止用のインラインデータURI -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-1 sm:p-4 bg-slate-950">

    <div id="app" class="w-full max-w-4xl min-h-0 sm:min-h-[720px] flex flex-col justify-between pixel-box-dark relative overflow-hidden p-2 sm:p-5">
        
        <!-- HEADER / TOP STATUS BAR -->
        <header class="w-full pixel-box p-2 sm:p-3 mb-2 sm:mb-3 flex flex-wrap items-center justify-between gap-2 sm:gap-3 bg-slate-900">
            <div class="flex items-center gap-2">
                <span class="text-[10px] sm:text-xs bg-slate-800 text-amber-300 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded border border-amber-600 font-bold">Ver 2.4 EX</span>
                <button onclick="renderHomeScreen()" class="pixel-btn text-[11px] sm:text-xs px-2 sm:px-2.5 py-1 font-bold flex items-center gap-1">🏠 ホーム</button>
            </div>
            <div class="flex items-center gap-1.5 sm:gap-3 flex-wrap">
                <button onclick="openProfileScreen()" class="pixel-box-gold px-2 py-0.5 sm:px-2.5 sm:py-1 flex items-center gap-1.5 sm:gap-2 cursor-pointer hover:opacity-90 transition-opacity">
                    <canvas id="header-profile-icon" width="36" height="36" class="pixel-box bg-slate-950 rounded w-8 h-8 sm:w-[40px] sm:h-[40px]"></canvas>
                    <span id="header-profile-name" class="text-amber-300 text-[11px] sm:text-xs font-bold truncate max-w-[80px] sm:max-w-[90px]">名無しファイター</span>
                </button>
                <div class="pixel-box-gold px-2.5 py-1 sm:px-3 sm:py-1.5 flex items-center gap-1.5 sm:gap-2">
                    <span class="text-amber-300 text-[11px] sm:text-xs font-bold">DOPA:</span>
                    <span id="dopa-count" class="text-amber-400 font-bold text-sm sm:text-lg font-pixel">1,000</span>
                </div>
                <button id="btn-sound-toggle" onclick="audioSystem.toggleSound()" class="pixel-btn text-[11px] sm:text-xs px-2 py-1 sm:px-2.5 sm:py-1.5 font-bold">
                    🔊:<span id="sound-status">ON</span>
                </button>
                <button id="btn-bgm-toggle" onclick="audioSystem.toggleBGM()" class="pixel-btn text-[11px] sm:text-xs px-2 py-1 sm:px-2.5 sm:py-1.5 font-bold">
                    🎵:<span id="bgm-status">OFF</span>
                </button>
            </div>
        </header>

        <!-- DYNAMIC CONTENT CONTAINER -->
        <main id="screen-container" class="flex-1 flex flex-col justify-center items-center w-full relative">
            <!-- Screen content injected via JS -->
        </main>

        <!-- FOOTER / SYSTEM MESSAGES -->
        <footer class="w-full mt-2 sm:mt-3 text-center text-[10px] sm:text-xs text-slate-500 border-t border-slate-800 pt-1.5 sm:pt-2 flex justify-between items-center px-1 sm:px-2">
            <span>© 2026 DOPAGA KINGDOM RPG EX</span>
            <span class="text-slate-400 text-[10px] sm:text-[11px]">8-Bit Retro Battle Engine Powered</span>
        </footer>
    </div>

    <!-- MODAL / NOTIFICATION OVERLAY -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/85 hidden flex items-center justify-center p-2 sm:p-4 z-50">
        <div class="pixel-box bg-slate-900 max-w-md w-full p-3 sm:p-5 text-center relative border-amber-400 max-h-[90vh] flex flex-col">
            <h3 id="modal-title" class="text-base sm:text-xl font-bold text-amber-400 mb-2 sm:mb-3 font-pixel"></h3>
            <div id="modal-body" class="text-slate-200 mb-4 sm:mb-6 text-xs sm:text-sm leading-relaxed whitespace-pre-line max-h-[60vh] overflow-y-auto text-left flex-1 pr-1"></div>
            <div id="modal-actions" class="flex justify-center gap-3">
                <button onclick="closeModal()" class="pixel-btn pixel-btn-primary px-6 py-2 font-bold text-sm">閉じる</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
